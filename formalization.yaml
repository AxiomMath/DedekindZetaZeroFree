status:
  scope: >-
    DedekindZetaZeroFree.main states the unconditional zero-free theorem for every
    number field. DedekindZetaZeroFree.heckeCorollary gives the corresponding
    finite-order Hecke L-function result. The full default build passes for all library modules, the
    Challenge, and the Solution, admitting only the three standard axioms.
    The sorry counts below exclude the intentional Challenge placeholders.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "DedekindZetaZeroFree.main"
      file: "Solution/DedekindZetaSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "DedekindZetaZeroFree.heckeCorollary"
      file: "Solution/DedekindZetaSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "manual"
      tool_setup: >-
        Dean Cureton and Jesse Thorner directed the research and made the
        mathematical judgments, as described in the manuscript. Dean Cureton
        directed repository preparation and maintains the formalization.
    - method: "agent"
      framework: "AxiomProver"
      tool_setup: >-
        Axiom Math's AI system generated the proofs and Lean formalization
        under the investigators' direction, as reported by the manuscript's
        provenance statement and Section 15.
  notes: >-
    AxiomProver generated the proofs and Lean formalization under human
    direction. Additional AI-assisted work covered proof integration, repository
    cleanup, documentation, and review. Dean Cureton is responsible for this
    formalization repository.

fidelity:
  divergences: >-
    The canonical statement is Challenge/DedekindZetaChallenge.lean. It states
    the existence of a holomorphic continuation away from 1, agreeing with
    Mathlib's Dedekind zeta function in its convergence half-plane, with the
    explicit zero-free bound 31/32. The quantification over every number field
    and this bound agree with Theorem 1.1. The exclusion of s = 1 makes the pole
    explicit. The Hecke statement concerns finite-order Hecke characters,
    represented in Lean as ray class characters, and their ideal Dirichlet
    series, with the same bound. It includes s = 1 for
    nonprincipal characters, whose continuations are entire.

review:
  status: "agent-reviewed"
  notes: >-
    Agent review, the full default build, and compiled transitive proof audits
    cover this unconditional checkpoint.
    The final Challenge statement was compared with Theorem 1.1 of the
    versioned Hexagon manuscript. This does not establish line-by-line
    correspondence between the informal and formal proofs.
