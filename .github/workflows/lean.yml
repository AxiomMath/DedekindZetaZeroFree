name: Lean verification

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      palomar_preflight:
        description: Run Palomar hosted preflight instead of the ordinary build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.palomar_preflight
    name: Compile library, Challenge, and Solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: "true"

  palomar:
    if: github.event_name == 'workflow_dispatch' && inputs.palomar_preflight
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: palomarpre01
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"comparator_config_path":"comparator.json","formalization_metadata_path":"formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}
