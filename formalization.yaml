version: "v0.4"

project:
  name: "A uniform zero-free region for Dedekind zeta functions"
  description: >-
    A Lean formalization of Theorem 1.1 and Corollary 1.2 of A quasi-Riemann hypothesis for
    Dedekind zeta functions: for every number field K, its Dedekind zeta
    function has no zeros in Re(s) > 31/32. The formal statement asserts
    the existence of a holomorphic function away from 1 that agrees with
    Mathlib's Dedekind zeta function for Re(s) > 1 and is nonzero for
    Re(s) > 31/32 with s different from 1. The corollary gives the same zero-free bound
    for Hecke L-functions associated with finite-order Hecke characters,
    including s = 1 for nonprincipal characters. These characters are
    represented in Lean as ray class characters. This repository contains the substantive Lean
    development, including its Challenge and Solution.
  authors: ["Dean Cureton"]
  responsible_maintainers: ["Dean Cureton"]
  license: "Apache-2.0"
  affiliations:
    - name: "Dean Cureton"
      institution: "Axiom Math"

sources:
  - title: "A quasi-Riemann hypothesis for Dedekind zeta functions"
    authors: ["Dean Cureton", "Jesse Thorner"]
    id: "https://hexagonmath.org/2610.00200v1"
    type: "paper"
    relationship: "formalizes"
    location: "Version 1 (12 October 2026), Theorem 1.1 and Corollary 1.2"
    note: >-
      Dean Cureton and Jesse Thorner directed the research and made the
      mathematical judgments. The manuscript and formalization were developed
      at Axiom Math with AxiomProver; Section 15 describes this human-AI
      collaboration. The compared theorems formalize Theorem 1.1 and the
      finite-order Hecke L-function claim in Corollary 1.2.
  - title: "Metaplectic forms"
    authors: ["D. A. Kazhdan", "S. J. Patterson"]
    id: "https://www.numdam.org/article/PMIHES_1984__59__35_0.pdf"
    type: "paper"
    relationship: "background"
    location: "IHES 59 (1984), I.1.3, I.2.9, I.6.4(c), I.6.5(c), II.1.3, p. 113, II.2.1–II.2.6"
    note: >-
      Background for the Eisenstein series, exceptional representations, and
      Whittaker models used in the mathematical development.
  - title: "Correction to Metaplectic forms"
    authors: ["D. A. Kazhdan", "S. J. Patterson"]
    id: "https://www.numdam.org/articles/10.1007/BF02698809/"
    type: "paper"
    relationship: "background"
    location: "1985 correction"
    note: "Correction to the Whittaker factorization normalization."
  - title: "Smooth Frechet globalizations of Harish-Chandra modules"
    authors: ["Joseph Bernstein", "Bernhard Krotz"]
    id: "https://arxiv.org/abs/0812.1684v3"
    type: "paper"
    relationship: "background"
    location: "Section 11.1, Proposition 11.2 and Example 11.1(a)"
    note: >-
      Background for fixed-level smooth globalization and the extension of
      automorphic realizations.

